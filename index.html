<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Seldon Project</title>
<meta name="description" content="A practical framework for systems that work for everyone. Coming soon.">
<style>
  :root { --bg:#0e1412; --fg:#e8e4da; --mute:#9aa39c; --accent:#f4894a; }
  @media (prefers-color-scheme: light) { :root { --bg:#f2efe8; --fg:#1d2420; --mute:#5c655f; } }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; background:var(--bg); color:var(--fg); font:16px/1.6 Georgia, "Times New Roman", serif; }
  main { position:relative; min-height:100%; display:flex; align-items:flex-end; padding:0 16px 10vh; overflow:hidden; }
  canvas { position:absolute; inset:0; width:100%; height:100%; opacity:.85; }
  .copy { position:relative; max-width:40rem; margin:0 auto; width:100%; }
  h1 { font:600 clamp(2rem,6vw,3.6rem)/1.05 "Helvetica Neue", Arial, sans-serif; letter-spacing:-.02em; }
  p { color:var(--mute); margin-top:.8rem; max-width:32rem; }
  .soon { display:inline-block; margin-top:1.4rem; font:500 .8rem/1 "Helvetica Neue", Arial, sans-serif; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
</style>
</head>
<body>
<main>
  <canvas id="lorenz" aria-hidden="true"></canvas>
  <div class="copy">
    <h1>The Seldon Project</h1>
    <p>A practical framework for systems that work for everyone, starting with how we grow food.</p>
    <span class="soon">Coming soon</span>
  </div>
</main>
<script src="home.js" defer></script>
</body>
</html>
